name: KAIROS Static Site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate Static Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          echo "Checking KAIROS required files..."
          files=(
            "index.html"
            "css/styles.css"
            "js/app.js"
            "js/engine.js"
            "js/content.js"
            "js/state.js"
            "js/audio.js"
            "js/visuals.js"
            "js/maat.js"
            "js/lexicon.js"
            "js/cultural.js"
            "js/ai-sentinel.js"
            "manifest.json"
            "sw.js"
          )
          all_ok=true
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ MISSING: $f"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then exit 1; fi
          echo "All required files present."

      - name: Validate HTML structure
        run: |
          grep -q "viewContainer" index.html && echo "✅ viewContainer found" || (echo "❌ viewContainer missing" && exit 1)
          grep -q "shadowProbeOverlay" index.html && echo "✅ shadowProbeOverlay found" || (echo "❌ shadowProbeOverlay missing" && exit 1)
          grep -q "js/app.js" index.html && echo "✅ app.js linked" || (echo "❌ app.js not linked" && exit 1)

      - name: Check JS syntax (Node.js --check)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Syntax check all JS modules
        run: |
          echo "Checking JS syntax..."
          all_ok=true
          for f in js/*.js; do
            # Use node --check for pure syntax validation only.
            # node --input-type=module executes the file and throws ERR_MODULE_NOT_FOUND
            # for cross-module ES imports in isolation — this is expected and NOT a syntax error.
            # Running it bare under bash -eo pipefail causes a false-positive exit 1.
            if node --check "$f" 2>/dev/null; then
              echo "  ✅ $f"
            else
              echo "  ❌ Syntax error: $f"
              node --check "$f"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then exit 1; fi
          echo "Syntax check complete."

      - name: Verify SAP canonical stage names
        run: |
          echo "Verifying constitutional SAP stage names..."
          stages=(
            "PLENARA"
            "SPARK OF NAVIGATION"
            "FORGE OF POLARITY"
            "ENGINE OF EXPRESSION"
            "CRUCIBLE OF EQUILIBRIUM"
            "DYNAMO OF WILL"
            "NEXUS OF HARMONY"
            "LENS OF DISTILLATION"
            "VESSEL OF GROUNDING"
            "TRANSPARENCY OF THE GUIDE"
          )
          all_ok=true
          for stage in "${stages[@]}"; do
            if grep -qr "$stage" js/; then
              echo "  ✅ $stage"
            else
              echo "  ❌ MISSING: $stage"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then exit 1; fi
          echo "All canonical SAP stage names verified."

      - name: Verify content library size
        run: |
          count=$(grep -c "entries.push" js/content.js 2>/dev/null || echo "0")
          echo "Content library push calls: $count"

      - name: Check Ma'at confessions
        run: |
          count=$(grep -c '"I have' js/maat.js 2>/dev/null || echo "0")
          echo "Ma'at confessions found: $count"
          if [ "$count" -lt 40 ]; then echo "❌ Expected at least 40 confessions, found $count" && exit 1; fi
          echo "✅ Ma'at confessions verified ($count/42)"

      - name: Summary
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  KAIROS CI — ALL CHECKS PASSED"
          echo "  Stanfield's Axiom of Perpetuity v8.1"
          echo "  MAAT · Meridian Axiom Alignment Tech"
          echo "════════════════════════════════════════"
