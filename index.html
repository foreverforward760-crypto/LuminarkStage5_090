<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <link rel="manifest" href="manifest.json">
    <title>KAIROS · Cognitive OS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="kairos-app">
        <header class="app-header glass">
            <div class="brand">
                <h1>KAIROS</h1>
                <span class="version">v1.0</span>
            </div>
            <div id="stateBanner" class="state-banner">
                <span id="categoryLabel">—</span>
                <span id="pressureLabel" class="pressure-tag">Stable</span>
            </div>
        </header>
        <nav class="app-nav glass">
            <button class="nav-tab active" data-view="protocol">Protocol</button>
            <button class="nav-tab" data-view="frequencies">Frequencies</button>
            <button class="nav-tab" data-view="breathwork">Breathwork</button>
            <button class="nav-tab" data-view="affirmations">Affirmations</button>
            <button class="nav-tab" data-view="journal">Journal</button>
        </nav>
        <main id="viewContainer" class="view-container"></main>
        <div id="audioStatus" class="audio-indicator"></div>
    </div>
    <canvas id="visualizerCanvas" class="visualizer-canvas"></canvas>
    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
        }
    </script>
</body>
</html>
