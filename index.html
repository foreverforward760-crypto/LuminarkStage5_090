<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <meta name="description" content="KAIROS Cognitive OS — State Diagnostic Engine. Stanfield's Axiom of Perpetuity v8.1">
    <link rel="manifest" href="manifest.json">
    <title>KAIROS · Cognitive OS — State Diagnostic Engine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="kairos-app">

        <!-- Shadow Probe Overlay (Mentalism Bridge — 4.5s NSDT calibration) -->
        <div id="shadowProbeOverlay" class="hidden" style="position:fixed;inset:0;background:rgba(11,14,20,0.97);z-index:200;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;backdrop-filter:blur(12px);">
          <div style="max-width:520px;">
            <div class="kairos-badge" style="margin-bottom:24px;border-color:var(--accent-blue);">KAIROS ENGINE ACTIVE</div>
            <div id="probeText" style="font-size:1.45rem;color:#e9edf5;line-height:1.6;font-style:italic;margin-bottom:32px;"></div>
            <div style="font-size:0.72rem;color:#3f6ea3;letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;" id="probeSubtext">Calibrating NSDT Centroids... Aligning Ma'at Protocol...</div>
            <div style="height:2px;background:rgba(255,255,255,0.08);width:200px;margin:0 auto;overflow:hidden;border-radius:1px;">
              <div id="probeLoaderFill" style="height:100%;background:linear-gradient(90deg,#3f6ea3,#8b5cf6);width:0%;transition:width 4.3s linear;border-radius:1px;"></div>
            </div>
          </div>
        </div>

        <header class="app-header glass">
            <div class="brand">
                <h1>KAIROS</h1>
                <span class="version">Cognitive OS v1.0</span>
            </div>
            <div id="stateBanner" class="state-banner">
                <span id="categoryLabel">—</span>
                <span id="pressureLabel" class="pressure-tag">Stable</span>
            </div>
        </header>

        <nav class="app-nav glass">
            <button class="nav-tab active" data-view="diagnostic">Diagnostic</button>
            <button class="nav-tab" data-view="protocol">Protocol</button>
            <button class="nav-tab" data-view="frequencies">Frequencies</button>
            <button class="nav-tab" data-view="breathwork">Breathwork</button>
            <button class="nav-tab" data-view="affirmations">Affirmations</button>
            <button class="nav-tab" data-view="journal">Journal</button>
        </nav>

        <main id="viewContainer" class="view-container"></main>
        <div id="audioStatus" class="audio-indicator"></div>
    </div>

    <canvas id="visualizerCanvas" class="visualizer-canvas"></canvas>

    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
        }
    </script>
</body>
</html>
