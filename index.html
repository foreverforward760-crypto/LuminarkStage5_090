<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <link rel="manifest" href="manifest.json">
    <title>KAIROS · Cognitive OS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="kairos-app">
        <!-- Shadow Probe Overlay (Mentalism Bridge) -->
        <div id="shadowProbeOverlay" class="hidden" style="position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px;">
          <div style="max-width:500px;">
            <div class="kairos-badge" style="margin-bottom:20px; border-color:var(--accent-blue);">Sensing Neural Signature...</div>
            <div id="probeText" class="wisdom-text" style="font-size:1.6rem; color:var(--text-bright); line-height:1.4;"></div>
            <div id="probeLoader" style="margin-top:30px; height:2px; background:var(--border); width:100px; margin-left:auto; margin-right:auto; overflow:hidden;">
              <div id="probeLoaderFill" style="height:100%; background:var(--accent-blue); width:0%; transition: width 4s linear;"></div>
            </div>
          </div>
        </div>
        <header class="app-header glass">
            <div class="brand">
                <h1>KAIROS</h1>
                <span class="version">v1.0</span>
            </div>
            <div id="stateBanner" class="state-banner">
                <span id="categoryLabel">—</span>
                <span id="pressureLabel" class="pressure-tag">Stable</span>
            </div>
        </header>
        <nav class="app-nav glass">
            <button class="nav-tab active" data-view="protocol">Protocol</button>
            <button class="nav-tab" data-view="frequencies">Frequencies</button>
            <button class="nav-tab" data-view="breathwork">Breathwork</button>
            <button class="nav-tab" data-view="affirmations">Affirmations</button>
            <button class="nav-tab" data-view="journal">Journal</button>
        </nav>
        <!-- Shadow Probe Overlay (Mentalism Bridge) -->
        <div id="shadowProbeOverlay" class="hidden" style="position:fixed;inset:0;background:#0b0e14;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;backdrop-filter:blur(8px);">
          <div style="max-width:500px;">
            <div class="kairos-badge" style="margin-bottom:20px;">Sensing Neural Signature...</div>
            <div id="probeText" style="font-size:1.5rem;color:#e9edf5;line-height:1.55;font-style:italic;"></div>
            <div style="margin-top:32px;height:2px;background:rgba(255,255,255,0.08);width:120px;margin-left:auto;margin-right:auto;overflow:hidden;border-radius:1px;">
              <div id="probeLoaderFill" style="height:100%;background:#3f6ea3;width:0%;transition:width 4s linear;border-radius:1px;"></div>
            </div>
            <div style="margin-top:16px;font-size:0.75rem;color:#5a8ab0;letter-spacing:2px;">KAIROS ENGINE ACTIVE</div>
          </div>
        </div>

        <main id="viewContainer" class="view-container"></main>
        <div id="audioStatus" class="audio-indicator"></div>
    </div>
    <canvas id="visualizerCanvas" class="visualizer-canvas"></canvas>
    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
        }
    </script>
</body>
</html>
